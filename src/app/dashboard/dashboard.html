<div class="container py-4">

  <div class="mb-4">
    <h2 class="fw-bold">
      Tableau de bord
    </h2>

    <p class="text-muted">
      Vue générale de la plateforme bancaire
    </p>
  </div>


  @if (stats$ | async; as stats) {

    <div class="row g-4">


      <div class="col-md-6 col-xl-3">

        <div class="card dashboard-card border-0 shadow-sm">

          <div class="card-body">

            <div class="d-flex justify-content-between">

              <div>

                <p class="text-muted mb-1">
                  Clients
                </p>

                <h2>
                  {{ stats.customers }}
                </h2>

              </div>

              <i class="bi bi-people fs-2 text-primary"></i>

            </div>

          </div>

        </div>

      </div>


      <div class="col-md-6 col-xl-3">

        <div class="card dashboard-card border-0 shadow-sm">

          <div class="card-body">

            <p class="text-muted mb-1">
              Comptes
            </p>

            <h2>
              {{ stats.accounts }}
            </h2>

          </div>

        </div>

      </div>


      <div class="col-md-6 col-xl-3">

        <div class="card dashboard-card border-0 shadow-sm">

          <div class="card-body">

            <p class="text-muted mb-1">
              Comptes actifs
            </p>

            <h2>
              {{ stats.activeAccounts }}
            </h2>

          </div>

        </div>

      </div>


    </div>

  }

</div>
