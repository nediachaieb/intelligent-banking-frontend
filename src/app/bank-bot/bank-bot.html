<div class="chat-container">

  <div class="input-group">

    <input
      type="text"
      class="form-control"
      placeholder="Posez votre question..."
      [(ngModel)]="query"
      (keyup.enter)="askAgent()"
    >

    <button
      class="btn btn-primary"
      (click)="askAgent()"
    >
      Envoyer
    </button>

  </div>

  @if (response$ | async; as response) {

    <div class="bot-response">
      {{ response }}
    </div>

  }

</div>
